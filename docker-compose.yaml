services:
  sourcershub-postgres:
    image: postgres:19rc1-bookworm
    container_name: sourcershub-env-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always

  sourcershub-postgres-migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations

  port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: sourcershub-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:sourcershub-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"
    depends_on:
      - sourcershub-postgres
    restart: always